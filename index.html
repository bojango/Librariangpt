<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#11100f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Library" />
  <title>LibrarianGPT</title>
  <link rel="manifest" href="./manifest.webmanifest?v=8" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css?v=8" />
  <link rel="stylesheet" href="./detail-v2.css?v=8" />
</head>
<body>
  <div id="app">
    <div class="boot-screen">
      <div class="brand-mark">L</div>
      <p>Opening library…</p>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" aria-live="polite"></div>
  <script type="module" src="./app.js?v=8"></script>
  <script type="module" src="./metadata-addon.js?v=8"></script>
  <script type="module" src="./cover-addon.js?v=8"></script>
  <script type="module" src="./detail-v2.js?v=8"></script>
  <script>
    document.addEventListener('click', event => {
      if (event.target.closest('#refresh')) {
        event.preventDefault();
        event.stopImmediatePropagation();
        location.reload();
      }
    }, true);

    if ('serviceWorker' in navigator) {
      let reloadingForUpdate = false;
      window.addEventListener('load', async () => {
        try {
          const registration = await navigator.serviceWorker.register('./sw.js?v=8', { scope: './' });
          registration.update();
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (reloadingForUpdate) return;
            reloadingForUpdate = true;
            location.reload();
          });
        } catch (error) {
          console.info('[LibrarianGPT] Service worker unavailable:', error);
        }
      });
    }
  </script>
</body>
</html>
