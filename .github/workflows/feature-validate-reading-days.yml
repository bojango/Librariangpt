name: Validate feature - reading days

on:
  push:
    branches:
      - feature/reading-days

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/reading-days

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Architecture check
        run: npm run check

      - name: Rebuild bundle
        run: npm run build

      - name: Verify committed bundle is current
        run: git diff --exit-code -- dist/app.js dist/app.js.map

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Full Playwright suite
        run: npm run test:e2e
