name: Feature build - reading days

on:
  push:
    branches:
      - feature/reading-days

permissions:
  contents: write

jobs:
  build-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/reading-days
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Architecture check
        run: npm run check

      - name: Build bundle
        run: npm run build

      - name: Commit generated bundle if changed
        run: |
          if git diff --quiet -- dist/app.js dist/app.js.map; then
            echo "Bundle already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/app.js dist/app.js.map
          git commit -m "Build reading days bundle"
          git push origin HEAD:feature/reading-days
